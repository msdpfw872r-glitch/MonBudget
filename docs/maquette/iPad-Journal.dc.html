<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Journal (iPad)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6F61}a:hover{color:#14524A}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F3F6F4; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1C2826; overflow: hidden; display: flex">
<nav aria-label="Navigation principale" style="width: 250px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #D9E1DE; padding: 28px 16px 20px; display: flex; flex-direction: column; gap: 8px">
  <span style="font-size: 26px; font-weight: 700; padding: 0 14px 18px; color: #1D6F61">Mon Budget</span>
  <a href="iPad-Accueil.dc.html" style="text-decoration: none; height: 60px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 20px; color: #1C2826;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a><a href="iPad-Trier.dc.html" style="text-decoration: none; height: 60px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 20px; color: #1C2826;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>À trier<span style="margin-left: auto; min-width: 32px; height: 32px; border-radius: 16px; background: #8A4B00; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">7</span></a><a href="iPad-Journal.dc.html" aria-current="page" style="text-decoration: none; height: 60px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 20px; background: #E1F0EC; color: #14524A; font-weight: 700;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Journal</a><a href="iPad-Resume.dc.html" style="text-decoration: none; height: 60px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 20px; color: #1C2826;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/></svg>Résumé</a>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="Importer.dc.html" style="text-decoration: none; height: 64px; border-radius: 18px; background: #1D6F61; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 700"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>Importer</a>
    <a href="Reglages.dc.html" style="text-decoration: none; height: 56px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 19px; color: #1C2826"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</a>
  </div>
</nav>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 36px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
  <h1 style="margin: 0; font-size: 34px; font-weight: 700">Journal</h1>
  <div style="display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-radius: 18px; padding: 4px">
    <button type="button" aria-label="Mois précédent" style="width: 52px; height: 52px; border: none; background: transparent; color: #1D6F61; cursor: pointer; font-size: 26px; font-weight: 700">‹</button>
    <span style="font-size: 21px; font-weight: 700; padding: 0 12px">Octobre 2026</span>
    <button type="button" aria-label="Mois suivant" style="width: 52px; height: 52px; border: none; background: transparent; color: #1D6F61; cursor: pointer; font-size: 26px; font-weight: 700">›</button>
  </div>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
  <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
    <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
  </sc-for>
</div>
<section style="background: #FFFFFF; border-radius: 24px; padding: 8px 24px; display: flex; flex-direction: column">
  <div role="row" style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 130px 200px 140px; gap: 12px; padding: 12px 0; font-size: 16px; font-weight: 700; color: #4F5E5B; border-bottom: 2px solid #E6ECE9">
    <span>Date</span><span>Opération</span><span>Pour qui</span><span>Catégorie</span><span style="text-align: right">Montant</span>
  </div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
    <div role="row" style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 130px 200px 140px; gap: 12px; align-items: center; min-height: 58px; font-size: 19px; border-bottom: 1px solid #E6ECE9">
      <span style="color: #4F5E5B">{{r.date}}</span>
      <span style="font-weight: 700">{{r.name}}</span>
      <span><span style="{{r.tagStyle}}">{{r.who}}</span></span>
      <span>{{r.cat}}</span>
      <span style="{{r.amountStyle}}">{{r.amount}}</span>
    </div>
  </sc-for>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: 'tous' };
  }
  renderVals() {
    const colors = { Maman: '#8A3466', Papa: '#2D5B99', 'Ménage': '#8C5A00' };
    const data = [
      ['14 oct.', 'Migros Sion', 'Ménage', 'Alimentation', '− 64.80', false],
      ['14 oct.', 'Pharmacie Sun Store', 'Maman', 'Pharmacie', '− 23.50', false],
      ['13 oct.', 'Rente AVS', 'Papa', 'Rente AVS', '+ 2’390.00', true],
      ['13 oct.', 'Rente AVS', 'Maman', 'Rente AVS', '+ 2’140.00', true],
      ['13 oct.', 'Groupe Mutuel', 'Papa', 'Caisse maladie', '− 512.35', false],
      ['10 oct.', 'Garage du Rhône', 'Ménage', 'Voiture', '− 186.00', false],
      ['8 oct.', 'Coiffure Élégance', 'Maman', 'Coiffeur et soins', '− 58.00', false]
    ];
    const w = this.state.who;
    const rows = data.filter((r) => w === 'tous' || r[2] === w).map(([date, name, who, cat, amount, inc]) => ({
      date, name, who, cat, amount,
      tagStyle: 'display: inline-block; padding: 3px 12px; border-radius: 12px; color: #FFFFFF; font-weight: 700; font-size: 16px; background: ' + colors[who] + ';',
      amountStyle: 'text-align: right; font-weight: 700; white-space: nowrap; color: ' + (inc ? '#1D6F61' : '#1C2826') + ';'
    }));
    const filters = [['tous', 'Tout le monde'], ['Maman', 'Maman'], ['Papa', 'Papa'], ['Ménage', 'Ménage']].map(([id, label]) => {
      const on = w === id; const c = colors[id] || '#1D6F61';
      return {
        label, pressed: on ? 'true' : 'false', pick: () => this.setState({ who: id }),
        style: 'font-family: inherit; height: 52px; padding: 0 22px; border-radius: 26px; font-size: 19px; cursor: pointer; ' +
          (on ? 'background: ' + c + '; color: #FFFFFF; border: 2px solid ' + c + '; font-weight: 700;' : 'background: #FFFFFF; color: #1C2826; border: 2px solid #D9E1DE;')
      };
    });
    return { rows, filters };
  }
}
</script>
</body>
</html>
