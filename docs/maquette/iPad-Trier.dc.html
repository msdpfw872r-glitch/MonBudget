<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>À trier (iPad)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6F61}a:hover{color:#14524A}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F3F6F4; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1C2826; overflow: hidden; display: flex">
<nav aria-label="Navigation principale" style="width: 250px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #D9E1DE; padding: 28px 16px 20px; display: flex; flex-direction: column; gap: 8px">
  <span style="font-size: 26px; font-weight: 700; padding: 0 14px 18px; color: #1D6F61">Mon Budget</span>
  <a href="iPad-Accueil.dc.html" style="text-decoration: none; height: 60px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 20px; color: #1C2826;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a><a href="iPad-Trier.dc.html" aria-current="page" style="text-decoration: none; height: 60px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 20px; background: #E1F0EC; color: #14524A; font-weight: 700;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>À trier<span style="margin-left: auto; min-width: 32px; height: 32px; border-radius: 16px; background: #8A4B00; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">7</span></a><a href="iPad-Journal.dc.html" style="text-decoration: none; height: 60px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 20px; color: #1C2826;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Journal</a><a href="iPad-Resume.dc.html" style="text-decoration: none; height: 60px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 20px; color: #1C2826;"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/></svg>Résumé</a>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="Importer.dc.html" style="text-decoration: none; height: 64px; border-radius: 18px; background: #1D6F61; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 700"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>Importer</a>
    <a href="Reglages.dc.html" style="text-decoration: none; height: 56px; border-radius: 16px; padding: 0 14px; display: flex; align-items: center; gap: 14px; font-size: 19px; color: #1C2826"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</a>
  </div>
</nav>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 36px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
  <h1 style="margin: 0; font-size: 34px; font-weight: 700">À trier</h1>
  <span style="font-size: 20px; color: #4F5E5B">{{doneCount}} triée(s) sur 7</span>
</div>
<div style="display: flex; gap: 20px; flex-grow: 1; min-height: 0">
  <section aria-label="Opérations à trier" style="width: 300px; flex-shrink: 0; background: #FFFFFF; border-radius: 24px; padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
      <button type="button" onClick="{{it.pick}}" aria-pressed="{{it.pressed}}" style="{{it.style}}">
        <span style="display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0">
          <span style="font-size: 18px; font-weight: 700">{{it.name}}</span>
          <span style="font-size: 15px; color: #4F5E5B">{{it.date}}</span>
        </span>
        <span style="font-size: 18px; font-weight: 700; white-space: nowrap">{{it.amount}}</span>
      </button>
    </sc-for>
  </section>
  <section style="flex-grow: 1; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 2px rgba(28,40,38,0.08)">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 17px; color: #4F5E5B">{{cur.date}} · BCVs</span>
        <span style="font-size: 30px; font-weight: 700">{{cur.name}}</span>
        <span style="font-size: 15px; color: #4F5E5B">Texte de la banque : {{cur.raw}}</span>
      </div>
      <span style="font-size: 30px; font-weight: 700; white-space: nowrap">{{cur.amount}}</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 21px; font-weight: 700">Pour qui ?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 21px; font-weight: 700">C’est quoi ?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>
    <label style="display: flex; align-items: center; gap: 14px; background: #F3F6F4; border-radius: 18px; padding: 14px 16px; font-size: 19px; cursor: pointer">
      <input type="checkbox" checked="{{remember}}" onChange="{{toggleRemember}}" style="width: 28px; height: 28px; accent-color: #1D6F61; flex-shrink: 0; margin: 0">
      <span>Toujours classer <strong>{{cur.name}}</strong> comme ça</span>
    </label>
    <div style="display: flex; gap: 12px; margin-top: auto; justify-content: flex-end">
      <button type="button" onClick="{{next}}" style="font-family: inherit; height: 64px; padding: 0 32px; border-radius: 20px; background: #FFFFFF; border: 2px solid #D9E1DE; color: #1C2826; font-size: 20px; cursor: pointer">Passer</button>
      <button type="button" onClick="{{validate}}" style="font-family: inherit; height: 64px; padding: 0 56px; border-radius: 20px; background: #1D6F61; border: none; color: #FFFFFF; font-size: 21px; font-weight: 700; cursor: pointer">Valider</button>
    </div>
  </section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, done: [], person: 'menage', cat: 'alim', remember: true };
  }
  renderVals() {
    const s = this.state;
    const list = [
      { name: 'Migros Sion', date: 'Mar. 14 octobre', amount: '− 64.80', raw: 'MIGROS M SION 1950 CARTE XXXX4567' },
      { name: 'Coop Pronto', date: 'Lun. 13 octobre', amount: '− 18.40', raw: 'COOP PRONTO SION CARTE XXXX4567' },
      { name: 'Manor', date: 'Sam. 11 octobre', amount: '− 89.90', raw: 'MANOR SION 1950' },
      { name: 'Café de la Place', date: 'Ven. 10 octobre', amount: '− 32.00', raw: 'SUMUP *CAFE DE LA PLACE' },
      { name: 'TWINT Laurent', date: 'Jeu. 9 octobre', amount: '− 50.00', raw: 'TWINT ENVOI LAURENT' },
      { name: 'Fleurs Valérie', date: 'Mer. 8 octobre', amount: '− 45.00', raw: 'FLEURS VALERIE SAVIESE' },
      { name: 'Retrait Bancomat', date: 'Lun. 6 octobre', amount: '− 200.00', raw: 'BANCOMAT BCVS SION' }
    ];
    const colors = { maman: '#8A3466', papa: '#2D5B99', menage: '#8C5A00' };
    const items = list.map((it, i) => {
      const on = s.sel === i;
      const done = s.done.indexOf(i) >= 0;
      return {
        ...it,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ sel: i }),
        style: 'font-family: inherit; color: #1C2826; width: 100%; min-height: 64px; border-radius: 16px; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; ' +
          (on ? 'background: #E1F0EC; border: 3px solid #1D6F61;' : 'background: #FFFFFF; border: 3px solid transparent;') +
          (done ? ' opacity: 0.45;' : '')
      };
    });
    const people = [['maman', 'Maman'], ['papa', 'Papa'], ['menage', 'Ménage']].map(([id, label]) => {
      const on = s.person === id; const c = colors[id];
      return {
        label, pressed: on ? 'true' : 'false', pick: () => this.setState({ person: id }),
        style: 'font-family: inherit; height: 64px; border-radius: 18px; font-size: 21px; font-weight: 700; cursor: pointer; ' +
          (on ? 'background: ' + c + '; color: #FFFFFF; border: 3px solid ' + c + ';' : 'background: #FFFFFF; color: ' + c + '; border: 2px solid ' + c + ';')
      };
    });
    const cats = [['alim', 'Alimentation'], ['drog', 'Ménage, droguerie'], ['pharma', 'Pharmacie'], ['resto', 'Restaurants'], ['cadeaux', 'Cadeaux'], ['autre', 'Autre…']].map(([id, label]) => {
      const on = s.cat === id;
      return {
        label, pressed: on ? 'true' : 'false', pick: () => this.setState({ cat: id }),
        style: 'font-family: inherit; min-height: 60px; border-radius: 16px; font-size: 19px; cursor: pointer; padding: 6px 10px; ' +
          (on ? 'background: #E1F0EC; color: #14524A; border: 3px solid #1D6F61; font-weight: 700;' : 'background: #FFFFFF; color: #1C2826; border: 2px solid #D9E1DE;')
      };
    });
    const go = (markDone) => {
      const done = markDone && s.done.indexOf(s.sel) < 0 ? s.done.concat([s.sel]) : s.done;
      this.setState({ done, sel: (s.sel + 1) % list.length });
    };
    return {
      items, people, cats,
      cur: list[s.sel],
      doneCount: s.done.length,
      remember: s.remember,
      toggleRemember: () => this.setState({ remember: !s.remember }),
      next: () => go(false),
      validate: () => go(true)
    };
  }
}
</script>
</body>
</html>
