<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6F61}a:hover{color:#14524A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F4; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1C2826; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 28px 20px 100px">

  <h1 style="margin: 0; font-size: 30px; font-weight: 700">Journal</h1>

  <div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-radius: 18px; padding: 4px">
    <button type="button" aria-label="Mois précédent" style="width: 52px; height: 52px; border: none; background: transparent; color: #1D6F61; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span style="font-size: 20px; font-weight: 700">Octobre 2026</span>
    <button type="button" aria-label="Mois suivant" style="width: 52px; height: 52px; border: none; background: transparent; color: #1D6F61; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700; color: #4F5E5B">{{d.label}}</h2>
        <div style="background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column">
          <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="2">
            <div style="{{r.rowStyle}}">
              <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
                <span style="font-size: 19px; font-weight: 700">{{r.name}}</span>
                <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #4F5E5B">
                  <span style="{{r.tagStyle}}">{{r.who}}</span>{{r.cat}}</span>
              </span>
              <span style="{{r.amountStyle}}">{{r.amount}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #D9E1DE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4F5E5B; font-size: 15px; border-top: 4px solid transparent">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
    <a href="Trier.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4F5E5B; font-size: 15px; border-top: 4px solid transparent">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>À trier</a>
    <a href="Journal.dc.html" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1D6F61; font-size: 15px; font-weight: 700; border-top: 4px solid #1D6F61">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Journal</a>
    <a href="Resume.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4F5E5B; font-size: 15px; border-top: 4px solid transparent">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/></svg>Résumé</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: 'tous' };
  }
  renderVals() {
    const colors = { Maman: '#8A3466', Papa: '#2D5B99', 'Ménage': '#8C5A00' };
    const data = [
      { label: 'Mardi 14 octobre', rows: [
        { name: 'Migros Sion', who: 'Ménage', cat: 'Alimentation', amount: '− 64.80', income: false },
        { name: 'Pharmacie Sun Store', who: 'Maman', cat: 'Pharmacie', amount: '− 23.50', income: false }
      ]},
      { label: 'Lundi 13 octobre', rows: [
        { name: 'Rente AVS', who: 'Papa', cat: 'Rente AVS', amount: '+ 2’390.00', income: true },
        { name: 'Rente AVS', who: 'Maman', cat: 'Rente AVS', amount: '+ 2’140.00', income: true },
        { name: 'Groupe Mutuel', who: 'Papa', cat: 'Caisse maladie', amount: '− 512.35', income: false }
      ]},
      { label: 'Vendredi 10 octobre', rows: [
        { name: 'Garage du Rhône', who: 'Ménage', cat: 'Voiture', amount: '− 186.00', income: false }
      ]}
    ];
    const w = this.state.who;
    const days = data.map((d) => {
      const rows = d.rows.filter((r) => w === 'tous' || r.who === w);
      return {
        label: d.label,
        rows: rows.map((r, i) => ({
          ...r,
          rowStyle: 'display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px;' + (i > 0 ? ' border-top: 1px solid #E6ECE9;' : ''),
          tagStyle: 'display: inline-block; padding: 2px 10px; border-radius: 10px; color: #FFFFFF; font-weight: 700; font-size: 14px; background: ' + colors[r.who] + ';',
          amountStyle: 'font-size: 19px; font-weight: 700; white-space: nowrap; color: ' + (r.income ? '#1D6F61' : '#1C2826') + ';'
        }))
      };
    }).filter((d) => d.rows.length > 0);
    const filters = [
      { id: 'tous', label: 'Tous' },
      { id: 'Maman', label: 'Maman' },
      { id: 'Papa', label: 'Papa' },
      { id: 'Ménage', label: 'Ménage' }
    ].map((f) => {
      const on = w === f.id;
      const c = colors[f.id] || '#1D6F61';
      return {
        label: f.label,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ who: f.id }),
        style: 'font-family: inherit; height: 48px; padding: 0 18px; border-radius: 24px; font-size: 18px; cursor: pointer; ' +
          (on ? 'background: ' + c + '; color: #FFFFFF; border: 2px solid ' + c + '; font-weight: 700;'
              : 'background: #FFFFFF; color: #1C2826; border: 2px solid #D9E1DE;')
      };
    });
    return { days, filters };
  }
}
</script>
</body>
</html>
