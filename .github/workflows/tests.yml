# tests.yml — Lance les tests automatiques à chaque push.
# Version : 0.2.0 — Auteur : FRE (Fidag) — Date : 2026-11-08
# Historique :
#   0.2.0  FRE (Fidag)  Première version (Node 22).
name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
